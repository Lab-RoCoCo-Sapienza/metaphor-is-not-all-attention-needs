# Every setting of every run. Nothing is passed on the command line except a run's name:
#
#     uv run python -m probes table1
#     uv run python -m probes all
#
# A run is one entry under `runs:`; `experiment` names the module in probes/experiments
# that computes it. Every key of a run is required, and unknown or repeated keys are rejected.
# A value used by several runs is written once and reused through a YAML anchor
# (`&name` defines it, `*name` reuses it, `<<: *name` copies a block and overrides keys).
#
# This file holds the numbers. The procedure (estimator types, class weighting, the scoring
# metric, how folds are grouped) is in the code.

mlp:
  # Table 1 and A.10: one 128-unit hidden layer, checkpoint with the lowest validation loss.
  table1: &mlp_table1
    standardize: true            # scale with the statistics of the training rows
    hidden: [128]
    dropout: 0.1
    batch_size: 64
    epochs: 100
    patience: 10
    learning_rate: 0.001
    weight_decay: 0.0001
    validation_fraction: 0.15    # of each training partition

  # A.11: the same model on raw (unstandardized) features.
  persona: &mlp_persona
    <<: *mlp_table1
    standardize: false

# What `python -m probes all` executes, in this order.
all: [table1, a11, a10]

runs:
  # Table 1: format and safety probes, as printed.
  table1:
    experiment: format_and_safety
    seed: 42                     # outer folds and estimators
    outer_folds: 5
    inner_folds: 5
    c_grid_log10: [-4, 3, 30]    # start exponent, stop exponent, number of values
    logreg_max_iter: 2000
    svc_max_iter: 5000
    prose_draw_seeds: &prose_draw_seeds [42, 43, 44, 45, 46]   # balanced prose subsamples
    mlp_evaluation: &mlp_evaluation
      model: *mlp_table1
      test_fraction: 0.15
      split_seeds: [7, 13, 42, 91, 123]   # format and poetry safety
      prose_split_seeds: [7]              # one split per balanced prose subsample

  # A.10: Table 1's MLP evaluation over hidden sizes and dropout. Prints the accuracy spreads.
  a10:
    experiment: mlp_ablation
    hidden_grid: [[64], [128], [256], [512], [128, 64], [256, 128]]
    dropout_grid: [0.0, 0.1]
    prose_draw_seeds: *prose_draw_seeds
    mlp_evaluation: *mlp_evaluation       # hidden and dropout are replaced by the grid

  # A.11: persona contrasts, as printed. The first table row repeats Table 1's format probe.
  a11:
    experiment: persona
    pooled_row: table1           # the run that supplies the first row
    seed: 42                     # balanced draws, folds and MLP
    folds: 5
    C: 1.0                       # logistic regression and SVC
    logreg_max_iter: 1000
    mlp: *mlp_persona

  # A.12: the two safety coefficient charts. Optional; not part of `all`.
  figures:
    experiment: feature_importance
    seed: 42                     # balanced prose draw and fold shuffling
    folds: 5
    C: 1.0
    max_iter: 1000
    y_step: {poetry: 0.5, prose: 0.25}    # major y-axis tick of each chart
