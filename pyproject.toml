[project]
name = "metaphor-is-not-all-attention-needs"
version = "1.0.0"
description = "Code for the paper 'Metaphor Is Not All Attention Needs': attention extraction from Qwen3-14B and probes over the resulting attention features"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    # Attention extraction (extract_attentions.py): the versions used for the paper.
    "torch==2.4.0",
    "transformers==4.57.6",
    "accelerate==1.15.0",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "huggingface-hub==0.36.2",
    "numpy==2.4.6",
    # Span annotation (annotate_spans.py): OpenAI judge and spaCy part-of-speech tagging.
    "openai==3.39.0",
    "spacy==3.8.18",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "it-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/it_core_news_sm-3.8.0/it_core_news_sm-3.8.0-py3-none-any.whl",
    # Probing (probes/).
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

# The extraction ran on the CUDA 12.1 build of PyTorch; macOS takes the PyPI build.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["probes/tests"]
