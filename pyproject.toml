[project]
name = "metaphor-is-not-all-attention-needs"
version = "1.0.0"
description = "Code for the paper 'Metaphor Is Not All Attention Needs': attention extraction from Qwen3-14B and probes over the resulting attention features"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["probes/tests"]
